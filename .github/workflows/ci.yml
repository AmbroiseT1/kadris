name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    # Bloque tout secret (clé, mot de passe, jeton) ajouté au code. Analyse les fichiers du commit,
    # pas l'historique : l'historique ancien est traité à part (réécriture git filter-repo).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint

  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-dummy-secret-key-0123456789-abcdefghijklmnop
      DATABASE_URL: sqlite:///./test.db
      CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            echo "No backend/tests directory, skipping"
          fi
