# Configuration Alembic. L'URL de la base vient de DATABASE_URL (app.core.config.settings),
# lue dans alembic/env.py : ne pas la renseigner ici.
#
# Depuis le dossier backend :
#   alembic upgrade head                      # appliquer les migrations
#   alembic revision --autogenerate -m "..."  # nouvelle migration après modification d'un modèle
#
# L'API applique aussi `upgrade head` au démarrage (RUN_MIGRATIONS_ON_STARTUP, activé par défaut).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
